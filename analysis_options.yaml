include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - '**/dist/**'
    - '**/node_modules/**'
    - .local/**
    # Acceptance templates are copied and analyzed with their generated imports.
    - packages/flax_ffi/test/runtime/internal/**
    # Apple example and copied FFI hosts are analyzed in their prepared applications.
    - packages/flax_ffi_codegen/example/app/**
    - packages/flax_ffi_codegen/test/**/host.dart
    # Historical FFI probes require their original generated acceptance inputs.
    - experiments/ffi_*/**
    # Copied into its own generated package and compiled by native-asset acceptance.
    - packages/flax_build/js/src/native/build.dart
    # A copied package with placeholder dependencies, analyzed independently.
    - packages/flax_codegen/example/author_template/**
    - .fvm/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

formatter:
  page_width: 80
  trailing_commas: automate
