name: flax_embedded
description: A modular playground for Flax widgets and host capabilities.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.9'

dependencies:
  flax_example_support: 0.0.0
  flax: 0.0.0
  flax_material_ui: 0.0.0
  flax_cupertino_ui: 0.0.0
  flax_canvas: 0.0.0
  flax_websocket: 0.0.0
  flax_local_storage: 0.0.0
  flax_sandbox_example: 0.0.0
  flutter:
    sdk: flutter
  material_ui: 1.9.0

dev_dependencies:
  flax_test: 0.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/flax_modules/
