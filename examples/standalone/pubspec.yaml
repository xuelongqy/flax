name: flax_standalone
description: A standalone Flutter application with its interface written in JavaScript.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.9'

dependencies:
  flax: 0.0.0
  flax_websocket: 0.0.0
  flax_local_storage: 0.0.0
  flax_canvas: 0.0.0
  flax_material_ui: 0.0.0
  path_provider: 2.1.6
  flutter:
    sdk: flutter

dev_dependencies:
  crypto: 3.0.8
  ffi: 2.2.0
  flax_test: 0.0.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  material_ui: 1.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/flax/
    - assets/flax/assets/images/
    - assets/flax/assets/data/
    - assets/flax_modules/
    - assets/flax_esm/
