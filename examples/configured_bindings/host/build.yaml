targets:
  $default:
    sources:
      - $package$
      - lib/**
      - test/**
      - integration_test/**
      - assets/**
      - pubspec.yaml
      - flax_package.yaml
      - bindings/*.yaml
      - bindings/*.yml
      - js/package.json
      - js-types/package.json
    builders:
      flax_codegen:bindings:
        enabled: true
        options:
          outputs:
            - js/internal/src/generated/admin.ts
            - js/internal/src/generated/app.ts
            - js/sdk/src/generated/bindings.ts
            - js/sdk/src/generated/delivery.ts
            - lib/flax_bindings/admin.dart
            - lib/flax_bindings/app.dart
            - lib/flax_bindings/shop.dart
            - lib/src/generated/internal/admin.g.dart
            - lib/src/generated/internal/app.g.dart
            - lib/src/generated/sdk/bindings.g.dart
            - lib/src/generated/sdk/delivery.g.dart
