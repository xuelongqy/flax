publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flax: 0.0.0
  flax_annotations: 0.0.0
  flutter:
    sdk: flutter

dev_dependencies:
