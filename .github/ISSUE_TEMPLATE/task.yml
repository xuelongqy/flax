name: Engineering task
description: Define a scoped implementation or infrastructure task.
title: ''
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the intended outcome and relevant context.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description:
        Identify affected areas, exclusions, and linked architecture decisions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable checks that establish completion.
    validations:
      required: true
