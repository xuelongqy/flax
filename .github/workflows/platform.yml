name: Platform SDK consumer

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      engine:
        type: string
        required: true
      scope:
        type: string
        required: true
      prepared:
        type: boolean
        default: false
      archive-proof:
        type: boolean
        default: false
      package:
        type: string
        default: ''
      file:
        type: string
        default: ''

env:
  FLAX_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  FLAX_PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

permissions:
  contents: read

jobs:
  linux:
    if: startsWith(inputs.target, 'linux-')
    runs-on:
      ${{ inputs.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      CC: clang-23
      CXX: clang++-23
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install baseline tools
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates jq unzip xz-utils python3-pip ninja-build build-essential pkg-config libgtk-3-dev liblzma-dev libglu1-mesa xvfb openssl
          curl --fail --location --retry 2 --output /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          echo 'deb https://apt.llvm.org/focal/ llvm-toolchain-focal-23 main' > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y clang-23 llvm-23
          ln -s /usr/bin/clang-23 /usr/local/bin/clang
          ln -s /usr/bin/clang++-23 /usr/local/bin/clang++
          python3 -m pip install 'cmake>=3.24,<5'
          ln -s /usr/bin/llvm-nm-23 /usr/local/bin/llvm-nm
          ln -s /usr/bin/llvm-readobj-23 /usr/local/bin/llvm-readobj
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verification paths
        shell: bash
        run: |
          mkdir -p 'build/platform/${{ inputs.target }}/ci'
          echo "FLAX_ENGINE_SDK_CACHE=$(pwd)/.cache/engine-sdk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        timeout-minutes: 15
        with:
          # ARM64 has no Linux release archive; main selects source installation,
          # then the action checks out the exact stable tag from .fvmrc.
          channel: ${{ runner.arch == 'ARM64' && 'main' || 'stable' }}
          flutter-version-file: .fvmrc
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache: true
          pub-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/engine-sdk
          key:
            sdk-${{ inputs.target }}-${{
            hashFiles('packages/flax_engine_*/native/sdk.lock.json') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            packages/flax_engine_*/build/platform/
            .dart_tool/hooks_runner/
          key:
            bridge-${{ inputs.target }}-${{ hashFiles('.fvmrc', 'packages/*/native/**',
            'packages/flax/lib/native_*.dart', 'packages/flax_engine_*/hook/**',
            'packages/flax_native_assets/**') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key:
            pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.fvmrc',
            'pubspec.lock') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/flax-pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}
      - name: Install locked dependencies
        id: dependencies
        shell: bash
        run: |
          {
            git config --global --add safe.directory "$(pwd)"
            git config --global --add safe.directory "$FLUTTER_ROOT"
            npm install --global "$(node -p 'require("./package.json").packageManager')"
            flutter pub get --enforce-lockfile
            pnpm install --frozen-lockfile --store-dir="$RUNNER_TEMP/flax-pnpm-store"
          } 2>&1 | tee 'build/platform/${{ inputs.target }}/ci/dependencies.log'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.prepared
        with:
          name: prepared-checks
          path: build/prepared
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.archive-proof
        with:
          name: archive-proof
          path: build/archive-proof
      - name: Configure verified preparation and stable consumer paths
        shell: bash
        run: |
          echo "FLAX_CONSUMER_CACHE=$RUNNER_TEMP/flax-consumers" >> "$GITHUB_ENV"
          if [ '${{ inputs.prepared }}' = true ]; then echo 'FLAX_PREPARED_CHECKS=build/prepared' >> "$GITHUB_ENV"; fi
          if [ '${{ inputs.archive-proof }}' = true ]; then echo 'FLAX_ARCHIVE_PROOF=build/archive-proof/archive-proof.json' >> "$GITHUB_ENV"; fi
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/flax-consumers
          key:
            consumer-${{ inputs.target }}-${{ inputs.engine }}-${{ inputs.scope }}-${{
            github.sha }}-${{ hashFiles('.fvmrc', '.node-version', 'pubspec.lock',
            'pnpm-lock.yaml', 'build/prepared/cache-key.txt') }}
      - name: Check emulator startup handling
        if: inputs.target == 'linux-x64'
        run:
          python3 -B -m unittest discover -s tool/test -p
          'start_android_emulator_test.py'
      - name: Verify on the baseline system
        shell: bash
        env:
          UI_PACKAGE: ${{ inputs.package }}
          UI_FILE: ${{ inputs.file }}
        run: |
          args=(--target='${{ inputs.target }}' --engine='${{ inputs.engine }}' --scope='${{ inputs.scope }}')
          if [ -n "$UI_PACKAGE" ]; then args+=(--package="$UI_PACKAGE"); fi
          if [ -n "$UI_FILE" ]; then args+=(--file="$UI_FILE"); fi
          xvfb-run -a dart run tool/check_platform.dart "${args[@]}"
      - name: Record preparation failures
        if: always()
        shell: bash
        run: |
          if [ ! -f 'build/platform/${{ inputs.target }}/verification.json' ]; then
            mkdir -p 'build/platform/${{ inputs.target }}/ci'
            echo 'Verification did not produce a receipt. Flutter: ${{ steps.flutter.outcome }}; dependencies: ${{ steps.dependencies.outcome }}. No runtime acceptance.' | tee 'build/platform/${{ inputs.target }}/ci/status.txt' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ inputs.target }}-${{ inputs.engine }}
          path: |
            build/platform/${{ inputs.target }}/verification.json
            build/platform/${{ inputs.target }}/ci/
            build/ui/
          if-no-files-found: warn

  native:
    if: ${{ !startsWith(inputs.target, 'linux-') }}
    runs-on:
      ${{ startsWith(inputs.target, 'windows-') && (inputs.target == 'windows-arm64' &&
      'windows-11-arm' || 'windows-2025') || startsWith(inputs.target, 'android-') &&
      'ubuntu-24.04' || (endsWith(inputs.target, '-x64') && 'macos-26-intel' ||
      'macos-26') }}
    timeout-minutes: ${{ inputs.target == 'macos-x64' && 180 || 120 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verification paths
        shell: bash
        run: |
          mkdir -p 'build/platform/${{ inputs.target }}/ci'
          cache_root="$(pwd)"
          if [ "$RUNNER_OS" = Windows ]; then cache_root="$(pwd -W)"; fi
          echo "FLAX_ENGINE_SDK_CACHE=$cache_root/.cache/engine-sdk" >> "$GITHUB_ENV"
      - name: Apple tools
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
      - name: Android tools
        if: startsWith(inputs.target, 'android-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm openssl
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;30.0.16248370' 'platforms;android-36'
          if [ '${{ inputs.target }}' = android-x64 ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-36;google_apis;x86_64' 'emulator'
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo 'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
          cmake --version
          ninja --version
      - name: Prepare Windows crash debugger
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: ./tool/prepare_windows_debugger.ps1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        timeout-minutes: 15
        continue-on-error: ${{ inputs.target == 'macos-x64' }}
        with:
          # Windows ARM64 also bootstraps the pinned stable tag from source.
          channel:
            ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && 'main' || 'stable'
            }}
          flutter-version-file: .fvmrc
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache: true
          pub-cache: false
      - name: Retry macOS x64 Flutter installation
        if: inputs.target == 'macos-x64' && steps.flutter.outcome == 'failure'
        id: flutter_retry
        timeout-minutes: 15
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          architecture: x64
          cache: true
          pub-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/engine-sdk
          key:
            sdk-${{ inputs.target }}-${{
            hashFiles('packages/flax_engine_*/native/sdk.lock.json') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            packages/flax_engine_*/build/platform/
            .dart_tool/hooks_runner/
          key:
            bridge-${{ inputs.target }}-${{ hashFiles('.fvmrc', 'packages/*/native/**',
            'packages/flax/lib/native_*.dart', 'packages/flax_engine_*/hook/**',
            'packages/flax_native_assets/**') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key:
            pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.fvmrc',
            'pubspec.lock') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/flax-pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}
      - name: Install locked dependencies
        id: dependencies
        shell: bash
        run: |
          {
            npm install --global "$(node -p 'require("./package.json").packageManager')"
            flutter pub get --enforce-lockfile
            pnpm install --frozen-lockfile --store-dir="$RUNNER_TEMP/flax-pnpm-store"
          } 2>&1 | tee 'build/platform/${{ inputs.target }}/ci/dependencies.log'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.prepared
        with:
          name: prepared-checks
          path: build/prepared
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.archive-proof
        with:
          name: archive-proof
          path: build/archive-proof
      - name: Configure verified preparation and stable consumer paths
        shell: bash
        run: |
          echo "FLAX_CONSUMER_CACHE=$RUNNER_TEMP/flax-consumers" >> "$GITHUB_ENV"
          if [ '${{ inputs.prepared }}' = true ]; then echo 'FLAX_PREPARED_CHECKS=build/prepared' >> "$GITHUB_ENV"; fi
          if [ '${{ inputs.archive-proof }}' = true ]; then echo 'FLAX_ARCHIVE_PROOF=build/archive-proof/archive-proof.json' >> "$GITHUB_ENV"; fi
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/flax-consumers
          key:
            consumer-${{ inputs.target }}-${{ inputs.engine }}-${{ inputs.scope }}-${{
            github.sha }}-${{ hashFiles('.fvmrc', '.node-version', 'pubspec.lock',
            'pnpm-lock.yaml', 'build/prepared/cache-key.txt') }}
      - name: Check Windows module delivery
        id: module_delivery
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --test packages/flax_tools/js/test/modules.test.mjs 2>&1 | tee 'build/platform/${{ inputs.target }}/ci/modules.log'
      - name: Check Windows debugger child-process capture
        id: debugger
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: bash
        run: |
          dart test tool/test/windows_crash_test.dart --reporter expanded 2>&1 | tee 'build/platform/${{ inputs.target }}/ci/debugger.log'
      - name: Start iOS simulator
        if: startsWith(inputs.target, 'ios-simulator-')
        shell: bash
        run: |
          test "$(uname -m)" = '${{ endsWith(inputs.target, '-x64') && 'x86_64' || 'arm64' }}'
          python3 tool/start_simulator.py >> "$GITHUB_ENV"
      - name: Start Android x64 emulator
        id: emulator
        if: inputs.target == 'android-x64'
        timeout-minutes: 13
        shell: bash
        run: |
          {
            ls -l /dev/kvm
            sudo chmod 666 /dev/kvm
            export ANDROID_USER_HOME="$RUNNER_TEMP/flax-android"
            export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
            export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
            mkdir -p "$ANDROID_AVD_HOME"
            echo no | timeout 60 "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n flax-ci -p "$ANDROID_AVD_HOME/flax-ci.avd" -k 'system-images;android-36;google_apis;x86_64'
            test -f "$ANDROID_AVD_HOME/flax-ci.ini"
            "$ANDROID_HOME/emulator/emulator" -list-avds
            python3 tool/start_android_emulator.py
          } 2>&1 | tee 'build/platform/android-x64/ci/startup.log'
          echo FLAX_CHECK_DEVICE=emulator-5554 >> "$GITHUB_ENV"
      - name: Verify selected target
        shell: bash
        env:
          UI_PACKAGE: ${{ inputs.package }}
          UI_FILE: ${{ inputs.file }}
        run: |
          args=()
          if [ -n "$UI_PACKAGE" ]; then args+=(--package="$UI_PACKAGE"); fi
          if [ -n "$UI_FILE" ]; then args+=(--file="$UI_FILE"); fi
          case '${{ inputs.target }}' in
            android-arm32|android-arm64|ios-device-arm64) args+=(--build-only) ;;
          esac
          if [ -n "${FLAX_CHECK_DEVICE:-}" ]; then args+=(--device="$FLAX_CHECK_DEVICE"); fi
          dart run tool/check_platform.dart --target=${{ inputs.target }} --engine=${{ inputs.engine }} --scope=${{ inputs.scope }} "${args[@]}"
      - name: Record preparation failures
        if: always()
        shell: bash
        run: |
          if [ ! -f 'build/platform/${{ inputs.target }}/verification.json' ]; then
            mkdir -p 'build/platform/${{ inputs.target }}/ci'
            echo 'Verification did not produce a receipt. Flutter: ${{ steps.flutter.outcome }}; Flutter retry: ${{ steps.flutter_retry.outcome }}; dependencies: ${{ steps.dependencies.outcome }}; modules: ${{ steps.module_delivery.outcome }}; debugger: ${{ steps.debugger.outcome }}; emulator: ${{ steps.emulator.outcome }}. No runtime acceptance.' | tee 'build/platform/${{ inputs.target }}/ci/status.txt' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ inputs.target }}-${{ inputs.engine }}
          path: |
            build/platform/${{ inputs.target }}/verification.json
            build/platform/${{ inputs.target }}/ci/
            build/ui/
          if-no-files-found: warn
