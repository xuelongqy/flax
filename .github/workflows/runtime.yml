name: Manual platform verification

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        default: macos-arm64
        options:
          - linux-x64
          - linux-arm64
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - android-x64
          - android-arm32
          - android-arm64
          - ios-simulator-arm64
          - ios-simulator-x64
          - ios-simulators
          - ios-device-arm64
      engine:
        type: choice
        default: all
        options: [all, hermes, v8]
      scope:
        type: choice
        default: all
        options: [all, platform, ui]
      package:
        type: string
        description: UI owner for scope ui; empty selects all owners
      file:
        type: string
        description: Owner-relative UI test file; requires package

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml

  platform:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target:
          ${{ fromJSON(inputs.target == 'ios-simulators' &&
          '["ios-simulator-arm64","ios-simulator-x64"]' || format('["{0}"]',
          inputs.target)) }}
    uses: ./.github/workflows/platform.yml
    with:
      target: ${{ matrix.target }}
      engine: ${{ inputs.engine }}
      scope: ${{ inputs.scope }}
      package: ${{ inputs.package }}
      file: ${{ inputs.file }}
      prepared: true
