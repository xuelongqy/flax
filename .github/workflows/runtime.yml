name: Manual platform verification

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        default: macos-arm64
        options:
          - linux-x64
          - linux-arm64
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - android-x64
          - android-arm32
          - android-arm64
          - ios-simulator-arm64
          - ios-simulator-x64
          - ios-device-arm64
      engine:
        type: choice
        default: all
        options: [all, hermes, v8]
      scope:
        type: choice
        default: all
        options: [all, platform]

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  platform:
    uses: ./.github/workflows/platform.yml
    with:
      target: ${{ inputs.target }}
      engine: ${{ inputs.engine }}
      scope: ${{ inputs.scope }}
