name: Package archive checks

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tool/check_packages.dart'
      - 'tool/check_release.dart'
      - 'tool/pack_archives.dart'
      - 'tool/src/archive_packing.dart'
      - 'tool/src/package_discovery.dart'
      - 'tool/src/package_metadata_strict.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/packages.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tool/check_packages.dart'
      - 'tool/check_release.dart'
      - 'tool/pack_archives.dart'
      - 'tool/src/archive_packing.dart'
      - 'tool/src/package_discovery.dart'
      - 'tool/src/package_metadata_strict.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        run:
          npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc

      - name: Install locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          pnpm install --frozen-lockfile

      - name: Build JavaScript package outputs
        run: dart run melos run js:build

      - name: Validate archives and pack receipt (no publish)
        run: dart run melos run release:check

      - name: Verify source files are unchanged
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
