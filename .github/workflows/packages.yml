name: Package archive checks

on:
  workflow_call:
    inputs:
      prepared:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLAX_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  FLAX_PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        run:
          npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc

      - name: Install locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          pnpm install --frozen-lockfile

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.prepared
        with:
          name: prepared-checks
          path: build/prepared
      - name: Consume shared preparation
        if: inputs.prepared
        run:
          dart --packages=.dart_tool/package_config.json tool/prepare_checks.dart
          --consume=build/prepared
      - name: Build JavaScript package outputs
        if: ${{ !inputs.prepared }}
        run: dart run melos run js:build

      - name: Validate archives and pack receipt (no publish)
        env:
          FLAX_ARCHIVE_PROOF_OUTPUT: build/archive-proof.json
        run: dart run melos run release:check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: archive-proof
          path: build/archive-proof.json
          if-no-files-found: error
      - name: Verify source files are unchanged
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
