name: Static workspace checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        run:
          npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false

      - name: Install native configuration and FFI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev

      - name: Install locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          pnpm install --frozen-lockfile

      - name: Check the full static workspace
        run: dart run melos run check

      - name: Verify reproducible FFI declarations
        run: dart run melos run ffi:check

      - name: Verify source files are unchanged
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

      - name: Record validation scope
        if: always()
        run: |
          printf '%s\n' \
            'This workflow checks the static workspace and package archives.' \
            'Runtime, UI and platform acceptance are not executed. Maintained-engine CI is pending.' \
            >> "$GITHUB_STEP_SUMMARY"

  archives:
    uses: ./.github/workflows/packages.yml

  result:
    if: always()
    needs: [workspace, archives]
    runs-on: ubuntu-24.04
    steps:
      - env:
          WORKSPACE: ${{ needs.workspace.result }}
          ARCHIVES: ${{ needs.archives.result }}
        run: |
          test "$WORKSPACE" = success
          test "$ARCHIVES" = success
