name: Workspace checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    uses: ./.github/workflows/packages.yml

  result:
    if: always()
    needs: [workspace]
    runs-on: ubuntu-24.04
    steps:
      - env:
          WORKSPACE: ${{ needs.workspace.result }}
        run: test "$WORKSPACE" = success
