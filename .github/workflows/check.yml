name: Workspace and Linux runtime checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      run: ${{ steps.targets.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.2
      - id: targets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=$(git hash-object -t tree /dev/null); fi
          dart tool/platform_changes.dart "$BASE" "$HEAD"

  prepare:
    uses: ./.github/workflows/prepare.yml

  archives:
    needs: prepare
    uses: ./.github/workflows/packages.yml
    with:
      prepared: true

  linux:
    needs: [prepare, archives]
    uses: ./.github/workflows/platform.yml
    with:
      target: linux-x64
      engine: all
      scope: all
      prepared: true
      archive-proof: true

  platforms:
    needs: [changes, prepare]
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/platform.yml
    with:
      target: ${{ matrix.target }}
      engine: ${{ matrix.engine }}
      scope: platform
      prepared: true

  result:
    if: always()
    needs: [changes, prepare, archives, linux, platforms]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          PREPARE: ${{ needs.prepare.result }}
          ARCHIVES: ${{ needs.archives.result }}
          LINUX: ${{ needs.linux.result }}
          PLATFORMS: ${{ needs.platforms.result }}
        run: |
          test "$CHANGES" = success
          test "$PREPARE" = success
          test "$ARCHIVES" = success
          test "$LINUX" = success
          test "$PLATFORMS" = success || test "$PLATFORMS" = skipped
