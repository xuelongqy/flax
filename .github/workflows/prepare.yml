name: Prepare shared verification inputs

on:
  workflow_call:

permissions:
  contents: read

env:
  FLAX_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  FLAX_PR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          flutter pub get --enforce-lockfile
          pnpm install --frozen-lockfile
      - name: Prepare once for this checkout
        run:
          dart --packages=.dart_tool/package_config.json tool/prepare_checks.dart
          --output=build/prepared
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-checks
          path: build/prepared/
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify tracked source is unchanged
        run: git diff --exit-code
