name: flax_canvas_example
description: Package-local example for flax_canvas.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flax_example_support: 0.0.0
  flax: 0.0.0
  flax_engine_v8: 0.0.0
  flax_canvas: 0.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flax_test: 0.0.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/flax_modules/
