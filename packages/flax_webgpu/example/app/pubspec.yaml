name: flax_webgpu_example
description: Interactive standard WebGPU studio and macOS validation.
publish_to: none
environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'
dependencies:
  flax_ffi_assets:
    path: .flax/ffi_assets
  material_ui: 1.11.0
  flax_example_support:
    path: ../../../flax_example_support
  flax:
    path: ../../../flax
  flax_webgpu:
    path: ../../../flax_webgpu
  flax_canvas:
    path: ../../../flax_canvas
  flutter:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/flax_modules/
