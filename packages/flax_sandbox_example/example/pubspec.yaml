name: flax_sandbox_playground
description: Runnable sandbox isolation example.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flax: 0.0.0
  flax_engine_v8: 0.0.0
  flax_example_support: 0.0.0
  flax_local_storage: 0.0.0
  flax_sandbox_example: 0.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flax_test: 0.0.0
  path_provider_platform_interface: 2.1.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/flax_modules/
