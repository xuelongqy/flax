name: flax_sandbox_example
description:
  Development-only sandbox playground shared by the standalone and embedded examples.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.9'

dependencies:
  flax: 0.0.0
  flax_engine_v8: 0.0.0
  flax_local_storage: 0.0.0
  flutter:
    sdk: flutter
  material_ui: 1.9.0
  path: 1.9.1
  path_provider: 2.1.6

flutter:
  assets:
    - assets/app.flax
