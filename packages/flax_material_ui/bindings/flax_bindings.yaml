format: 2
name: material
imports:
  - flax
library: package:material_ui/material_ui.dart
automatic: true
jsPackage: '@flax/material-ui'
dartOutput: lib/src/generated/material_bindings.g.dart
tsOutput: js/src/generated/bindings.ts
publicLibraries:
  package:material_ui/material_ui.dart:
    jsPackage: '@flax/material-ui'
    tsOutput: js/src/generated/libraries/material/index.ts
overrides:
  # The shared JS host owns application roots.
  exclude: [runApp]
  classes:
    AppBar:
      widgetInterfaces:
        - PreferredSizeWidget
    # Preserve the established reactive constructor API for rendering adapters.
    Material: &renderOnlyWidget
      getters: []
      setters: []
      instanceMethods: {}
    InkWell: *renderOnlyWidget
    LinearProgressIndicator: *renderOnlyWidget
    AlertDialog: *renderOnlyWidget
    MaterialApp: *renderOnlyWidget
    Scaffold: *renderOnlyWidget
    RefreshIndicator: *renderOnlyWidget
    Theme: *renderOnlyWidget
    TextField: *renderOnlyWidget
    TextButton: *renderOnlyWidget
    ElevatedButton: *renderOnlyWidget
    OutlinedButton: *renderOnlyWidget
    FilledButton: *renderOnlyWidget
    IconButton: *renderOnlyWidget
    FloatingActionButton: *renderOnlyWidget
    Drawer: *renderOnlyWidget
    Divider: *renderOnlyWidget
    VerticalDivider: *renderOnlyWidget
    Card: *renderOnlyWidget
    ListTile: *renderOnlyWidget
    Checkbox: *renderOnlyWidget
    Switch: *renderOnlyWidget
    CircularProgressIndicator: *renderOnlyWidget
    NavigationDestination: *renderOnlyWidget
    NavigationBar: *renderOnlyWidget
  functions:
    showDialog:
      route:
        builders:
          - builder
