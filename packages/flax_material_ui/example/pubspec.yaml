name: flax_material_ui_example
description: Package-local example for flax_material_ui.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flax_example_support: 0.0.0
  flax: 0.0.0
  flax_engine_v8: 0.0.0
  flax_material_ui: 0.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  material_ui: 1.1.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/flax_modules/
