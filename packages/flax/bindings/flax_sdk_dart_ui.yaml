format: 2
name: sdk_dart_ui
library: dart:ui
automatic: true
overrides:
  # The host supplies the private font collection; JS keeps its existing signature.
  classes:
    ParagraphBuilder:
      constructors:
        '': [style]
  # Module fonts must acquire native resources through their Session.
  exclude: [FlaxFontCollection, flaxScopedFontStats]
jsPackage: '@flax/dart/ui'
dartOutput: lib/src/generated/sdk_dart_ui_bindings.g.dart
tsOutput: js/src/dart/generated/libraries/ui/index.ts
publicLibraries:
  dart:ui:
    jsPackage: '@flax/dart/ui'
    tsOutput: js/src/dart/generated/libraries/ui/index.ts
