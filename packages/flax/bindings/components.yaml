format: 2
name: components
library: package:flutter/widgets.dart
jsPackage: '@flax/flutter/widgets'
dartOutput: lib/src/generated/state_callbacks.dart
tsOutput: js/src/flutter/generated/state_callbacks.ts
publicLibraries:
  package:flutter/widgets.dart:
    jsPackage: '@flax/flutter/widgets'
    tsOutput: js/src/flutter/generated/libraries/widgets/components.ts
classes:
  StatefulWidget:
    kind: object
  State:
    kind: state
    proxyVariants:
      SingleTickerProviderState:
        mixins:
          - SingleTickerProviderStateMixin
      TickerProviderState:
        mixins:
          - TickerProviderStateMixin
      KeepAliveTickerState:
        mixins:
          - AutomaticKeepAliveClientMixin
          - TickerProviderStateMixin
