format: 2
name: sdk_rendering
library: package:flutter/rendering.dart
automatic: true
jsPackage: '@flax/flutter/rendering'
dartOutput: lib/src/generated/sdk_rendering_bindings.g.dart
tsOutput: js/src/flutter/generated/libraries/rendering/index.ts
publicLibraries:
  package:flutter/rendering.dart:
    jsPackage: '@flax/flutter/rendering'
    tsOutput: js/src/flutter/generated/libraries/rendering/index.ts
overrides:
  # The host supplies the private font collection; JS keeps its existing signature.
  classes:
    RenderEditable:
      constructors:
        '':
          [
            text,
            textDirection,
            textAlign,
            cursorColor,
            backgroundCursorColor,
            showCursor,
            hasFocus,
            startHandleLayerLink,
            endHandleLayerLink,
            maxLines,
            minLines,
            expands,
            strutStyle,
            selectionColor,
            textScaleFactor,
            textScaler,
            selection,
            offset,
            ignorePointer,
            readOnly,
            forceLine,
            textHeightBehavior,
            textWidthBasis,
            obscuringCharacter,
            obscureText,
            locale,
            cursorWidth,
            cursorHeight,
            cursorRadius,
            paintCursorAboveText,
            cursorOffset,
            devicePixelRatio,
            selectionHeightStyle,
            selectionWidthStyle,
            enableInteractiveSelection,
            floatingCursorAddedMargin,
            promptRectRange,
            promptRectColor,
            clipBehavior,
            textSelectionDelegate,
            painter,
            foregroundPainter,
            children,
          ]
    RenderParagraph:
      constructors:
        '':
          [
            text,
            textAlign,
            textDirection,
            softWrap,
            overflow,
            textScaleFactor,
            textScaler,
            maxLines,
            locale,
            strutStyle,
            textWidthBasis,
            textHeightBehavior,
            children,
            selectionColor,
            registrar,
            devicePixelRatio,
          ]

# Session resource isolation. Unmarked APIs keep ordinary binding behavior.
sandbox:
  'version': 1
  'classes':
    'RendererBinding':
      'staticGetters':
        'instance': 'deny'
      'getters':
        'window': 'deny'
        'platformDispatcher': 'deny'
        'defaultBinaryMessenger': 'deny'
        'channelBuffers': 'deny'
    'RenderingFlutterBinding':
      'getters':
        'window': 'deny'
        'platformDispatcher': 'deny'
        'defaultBinaryMessenger': 'deny'
        'channelBuffers': 'deny'
