format: 2
name: sdk_widgets
library: package:flutter/widgets.dart
automatic: true
jsPackage: '@flax/flutter/widgets'
dartOutput: lib/src/generated/sdk_widgets_bindings.g.dart
tsOutput: js/src/flutter/generated/libraries/widgets/index.ts
publicLibraries:
  package:flutter/widgets.dart:
    jsPackage: '@flax/flutter/widgets'
    tsOutput: js/src/flutter/generated/libraries/widgets/index.ts
# The host owns runApp; SDK bindings must not replace the embedded root.
overrides:
  # The host supplies the private font collection; JS keeps its existing signature.
  classes:
    BannerPainter:
      getters:
        [
          semanticsBuilder,
          message,
          textDirection,
          location,
          layoutDirection,
          color,
          textStyle,
          shadow,
        ]
      constructors:
        '':
          [message, textDirection, location, layoutDirection, color, textStyle, shadow]
  exclude: [runApp, DefaultFontCollection, FlaxFontResources, FlaxFontResourceBoundary]
