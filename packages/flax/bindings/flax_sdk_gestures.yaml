format: 2
name: sdk_gestures
library: package:flutter/gestures.dart
automatic: true
jsPackage: '@flax/flutter/gestures'
dartOutput: lib/src/generated/sdk_gestures_bindings.g.dart
tsOutput: js/src/flutter/generated/libraries/gestures/index.ts
publicLibraries:
  package:flutter/gestures.dart:
    jsPackage: '@flax/flutter/gestures'
    tsOutput: js/src/flutter/generated/libraries/gestures/index.ts

# Session resource isolation. Unmarked APIs keep ordinary binding behavior.
sandbox:
  'version': 1
  'classes':
    'GestureBinding':
      'staticGetters':
        'instance': 'deny'
      'getters':
        'window': 'deny'
        'platformDispatcher': 'deny'
