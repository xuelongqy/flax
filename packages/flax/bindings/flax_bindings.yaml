overrides:
  classes:
    Error:
      instanceMethods:
        toString: []
    Symbol:
      instanceMethods:
        toString: []
    Stream:
      kind: stream
      asyncIterableFactory: fromAsyncIterable
      callbackSignatures:
        listen.onError:
          - Object
          - StackTrace
        handleError.onError:
          - Object
          - StackTrace
      callbackOptionalParameters:
        listen.onError:
          - 1
        handleError.onError:
          - 1
      callbackErrorParameters:
        listen.onError:
          - 0
        handleError.onError:
          - 0
      callbackScopedParameters:
        timeout.onTimeout:
          - 0
    StreamSubscription:
      callbackSignatures:
        onError.handleError:
          - Object
          - StackTrace
      callbackOptionalParameters:
        onError.handleError:
          - 1
      callbackErrorParameters:
        onError.handleError:
          - 0
    EventSink:
      proxy: implements
    StreamConsumer:
      proxy: implements
    StreamTransformer:
      proxy: implements
      callbackScopedParameters:
        fromHandlers.handleData:
          - 1
        fromHandlers.handleError:
          - 2
        fromHandlers.handleDone:
          - 0
    StreamTransformerBase:
      proxy: extends
    StreamView:
      kind: stream
    AsyncSnapshot:
      errorGetters:
        - error
    Listenable:
      listenerPairs:
        addListener: removeListener
    ValueListenable:
      proxy: extends
    PreferredSizeWidget:
      kind: widgetInterface
      proxy: implements
    PreferredSize:
      widgetInterfaces:
        - PreferredSizeWidget
    TextEditingController:
      disposeMethod: dispose
      listenerPairs:
        addListener: removeListener
    NavigatorState:
      kind: state
      startsRoute:
        - push
        - pushNamed
        - pushReplacement
    BuildContext:
      kind: context
    Text:
      proxy: extends
    ScrollController:
      disposeMethod: dispose
      listenerPairs:
        addListener: removeListener
    FocusNode:
      disposeMethod: dispose
      listenerPairs:
        addListener: removeListener
    Form:
      getters: []
      setters: []
      instanceMethods: {}
      data:
        constructors:
          '':
            - onPopInvokedWithResult
    Spacer: &renderOnlyWidget
      getters: []
      setters: []
      instanceMethods: {}
    StreamBuilder:
      getters: []
      setters: []
      instanceMethods: {}
      typeArguments:
        - Object?
    ValueListenableBuilder:
      getters: []
      setters: []
      instanceMethods: {}
      typeArguments:
        - Object?
    ListenableBuilder: *renderOnlyWidget
    Container: *renderOnlyWidget
    DecoratedBox: *renderOnlyWidget
    Expanded: *renderOnlyWidget
    Flexible: *renderOnlyWidget
    Stack: *renderOnlyWidget
    Positioned: *renderOnlyWidget
    Align: *renderOnlyWidget
    Navigator: *renderOnlyWidget
    NavigatorPopHandler:
      getters: []
      setters: []
      instanceMethods: {}
      typeArguments:
        - Object?
    PopScope:
      getters: []
      setters: []
      instanceMethods: {}
      typeArguments:
        - Object?
    Builder: *renderOnlyWidget
    LayoutBuilder: *renderOnlyWidget
    Directionality: *renderOnlyWidget
    Row: *renderOnlyWidget
    Column: *renderOnlyWidget
    Center: *renderOnlyWidget
    Padding: *renderOnlyWidget
    SizedBox: *renderOnlyWidget
    ListView: *renderOnlyWidget
    SingleChildScrollView: *renderOnlyWidget
    Listener: *renderOnlyWidget
    MouseRegion: *renderOnlyWidget
    KeyboardListener: *renderOnlyWidget
    SafeArea: *renderOnlyWidget
    Wrap: *renderOnlyWidget
    FittedBox: *renderOnlyWidget
    AspectRatio: *renderOnlyWidget
    ConstrainedBox: *renderOnlyWidget
    Opacity: *renderOnlyWidget
    Visibility: *renderOnlyWidget
    ColoredBox: *renderOnlyWidget
    ClipRRect: *renderOnlyWidget
    IgnorePointer: *renderOnlyWidget
    IndexedStack: *renderOnlyWidget
    GestureDetector: *renderOnlyWidget
    Focus: *renderOnlyWidget
