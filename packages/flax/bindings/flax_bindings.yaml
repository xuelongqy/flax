jsPackage: '@flax/core/navigation'
dartOutput: lib/src/generated/flutter_bindings.g.dart
tsOutput: js/src/flutter/generated/bindings.ts
publicLibraries:
  package:flutter/widgets.dart:
    jsPackage: '@flax/flutter/widgets'
    tsOutput: js/src/flutter/generated/libraries/widgets/index.ts
