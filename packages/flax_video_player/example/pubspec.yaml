name: flax_video_player_example
description: Native video playback controlled through Flax generated bindings.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.9'

dependencies:
  flax: 0.0.0
  flax_engine_v8: 0.0.0
  flax_example_support: 0.0.0
  flax_material_ui: 0.0.0
  flax_video_player: 0.0.0
  flutter:
    sdk: flutter
  video_player: 2.14.1
  video_player_platform_interface: ^6.9.0

dev_dependencies:
  flax_test: 0.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/flax_modules/
