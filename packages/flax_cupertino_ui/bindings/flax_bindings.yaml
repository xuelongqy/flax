format: 2
name: cupertino
imports:
  - flax
library: package:cupertino_ui/cupertino_ui.dart
automatic: true
jsPackage: '@flax/cupertino-ui'
dartOutput: lib/src/generated/cupertino_bindings.g.dart
tsOutput: js/src/generated/bindings.ts
publicLibraries:
  package:cupertino_ui/cupertino_ui.dart:
    jsPackage: '@flax/cupertino-ui'
    tsOutput: js/src/generated/libraries/cupertino/index.ts
overrides:
  # The shared JS host owns application roots.
  exclude: [runApp]
  # Flutter reads these interfaces on the actual native Widget.
  classes:
    ObstructingPreferredSizeWidget:
      kind: widgetInterface
      proxy: implements
    CupertinoNavigationBar:
      widgetInterfaces:
        - ObstructingPreferredSizeWidget
    # Preserve the established reactive constructor API for rendering adapters.
    CupertinoApp: &renderOnlyWidget
      getters: []
      setters: []
      instanceMethods: {}
    CupertinoPageScaffold: *renderOnlyWidget
    CupertinoButton: *renderOnlyWidget
